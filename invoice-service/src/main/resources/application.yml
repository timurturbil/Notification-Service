spring:
  application:
    name: invoice-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        # the relay waits 5 s for each send; a send it gave up on must not be delivered later
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

  # Redis (ShedLock lock for the daily due check)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  flyway:
    enabled: true

server:
  port: 8081

application:
  due-check:
    cron: "0 0 8 * * *"
  kafka:
    topic:
      partitions: 3
      replication-factor: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.notification: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: INFO
