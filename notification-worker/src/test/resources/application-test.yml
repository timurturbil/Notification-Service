spring:
  application:
    name: notification-worker-test
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group-test
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    export:
      prometheus:
        enabled: false

logging:
  level:
    root: WARN
    com.notification: DEBUG
    org.springframework.kafka: WARN
